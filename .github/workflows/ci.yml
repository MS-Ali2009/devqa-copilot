name: DevQA Copilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Lint, Typecheck, Test & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Secret Absence in Source Code
        run: |
          echo "Scanning for accidental committed secrets..."
          ! grep -r "sk-proj-" src/
          ! grep -r "NEXT_PUBLIC_OPENAI_API_KEY" src/

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests & Coverage Gate
        run: npm run test:coverage

      - name: Build Next.js Application
        run: npm run build
        env:
          FORCE_MOCK_PROVIDER: "true"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Mock Provider)
        run: npm run test:e2e
        env:
          FORCE_MOCK_PROVIDER: "true"
